<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Лесногорск"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#173a33"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Лесногорск — карта</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173a33;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}#bottom{position:fixed;bottom:0;left:0;right:0;min-height:94px;padding:23px 8px calc(22px + env(safe-area-inset-bottom));background:#202126;color:white;text-align:center;border-radius:28px 28px 0 0;font-size:clamp(22px,6vw,30px);font-weight:650;pointer-events:none}#bottom span{color:#a6a7ad;font-weight:500}</style></head><body><canvas id="map" aria-label="Карта Лесногорского шоссе"></canvas><div id="bottom">Ещё 9 мин <span>· 1 км</span></div><script>
const img=new Image();img.src='map.jpg';const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');let w=0,h=0,zoom=1,offX=0,offY=0;const fingers=new Map();let previous=null;
function resize(){w=innerWidth;h=innerHeight;const r=Math.min(devicePixelRatio||1,3);canvas.width=Math.round(w*r);canvas.height=Math.round(h*r);ctx.setTransform(r,0,0,r,0,0);draw()}
function draw(){ctx.fillStyle='#173a33';ctx.fillRect(0,0,w,h);if(!img.complete||!img.naturalWidth)return;const scale=Math.max(w/img.width,h/img.height)*zoom;ctx.save();ctx.translate(w/2+offX,h/2+offY);ctx.drawImage(img,-img.width*scale/2,-img.height*scale/2,img.width*scale,img.height*scale);ctx.restore()}
img.onload=draw;function metrics(){const pts=[...fingers.values()];if(!pts.length)return null;if(pts.length===1)return{x:pts[0].x,y:pts[0].y,d:0};return{x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2,d:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)}}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});previous=metrics()});canvas.addEventListener('pointermove',e=>{if(!fingers.has(e.pointerId))return;fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});const now=metrics();if(previous){offX+=now.x-previous.x;offY+=now.y-previous.y;if(now.d&&previous.d)zoom=Math.min(4,Math.max(.65,zoom*now.d/previous.d))}previous=now;draw()});for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,e=>{fingers.delete(e.pointerId);previous=metrics()});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.65,Math.min(4,zoom*(e.deltaY>0?.92:1.08)));draw()},{passive:false});addEventListener('resize',resize);resize();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
